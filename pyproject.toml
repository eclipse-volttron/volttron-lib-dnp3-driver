[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.poetry]
name = "volttron-lib-dnp3-driver"
version = "2.0.0rc1"
description = "DNP3 (IEEE 1815) driver interface for the VOLTTRON Platform Driver, served by the DNP3 Protocol Proxy."
authors = ["VOLTTRON Team <volttron@pnnl.gov>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/eclipse-volttron/volttron-lib-dnp3-driver"
homepage = "https://github.com/eclipse-volttron/volttron-lib-dnp3-driver"
keywords = []
packages = [ { include = "volttron", from = "src" } ]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: Apache Software License"
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
volttron-lib-base-driver = ">=2.0.0rc7"
protocol-proxy-dnp3 = ">=2.0.0rc1"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[tool.poetry.group.documentation.dependencies]
Sphinx = "^4.5.0"
sphinx-rtd-theme = "^1.0.0"

[tool.yapf]
based_on_style = "pep8"
spaces_before_comment = 4
column_limit = 120
split_before_logical_operator = true

[tool.yapfignore]
ignore_patterns = [
    ".venv/**",
    ".pytest_cache/**",
    "dist/**",
    "docs/**"
]
